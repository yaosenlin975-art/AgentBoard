<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>待决策区重做 · 高保真原型（DEC-REDESIGN）</title>
<link rel="stylesheet" href="styles.css">
</head>
<body>

<!-- 原型控制条：明确不是产品 UI -->
<div class="proto-bar" role="region" aria-label="原型演示控制条（不属于产品界面）">
  <div class="proto-brand">
    <span class="proto-dot" aria-hidden="true"></span>
    <strong>待决策区重做</strong>
    <span class="proto-sub">高保真可点原型 · 演示控制条（非产品 UI）</span>
  </div>
  <div class="proto-group" role="group" aria-label="演示场景">
    <button type="button" class="proto-btn is-on" data-action="scene" data-scene="queue" aria-pressed="true">常态队列</button>
    <button type="button" class="proto-btn" data-action="scene" data-scene="empty" aria-pressed="false">空态</button>
    <button type="button" class="proto-btn" data-action="scene" data-scene="single" aria-pressed="false">单条</button>
    <button type="button" class="proto-btn" data-action="scene" data-scene="long" aria-pressed="false">长问题</button>
    <button type="button" class="proto-btn" data-action="toggle-narrow" aria-pressed="false">窄屏预览</button>
    <button type="button" class="proto-btn" data-action="fast-forward">快进 60s</button>
    <button type="button" class="proto-btn" data-action="theme">深色</button>
  </div>
  <a class="proto-link" href="DESIGN-NOTES.md">设计说明</a>
</div>

<div class="stage" id="stage">
  <div class="app-shell" id="app-shell">

    <!-- 侧栏：与生产 176px 六入口一致；待决策徽标为本次设计重点 -->
    <nav class="sb" aria-label="主导航">
      <div class="sb-ws">
        <div class="sb-ws-name"><span class="caret" aria-hidden="true">▾</span>任务看板</div>
        <div class="sb-ws-path" title="D:\WorkSpaces\任务看板">D:\WorkSpaces\任务看板</div>
      </div>
      <ul class="sb-nav" role="list">
        <li>
          <button type="button" class="sb-item" data-action="switch-view" data-view="board" aria-label="任务看板">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="3" width="7" height="18" rx="1.5"/><rect x="14" y="3" width="7" height="10" rx="1.5"/></svg>
            <span class="sb-label">任务看板</span>
          </button>
        </li>
        <li>
          <button type="button" class="sb-item is-active" data-action="switch-view" data-view="decisions" aria-label="待决策" aria-current="page">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21 12a9 9 0 1 1-3.2-6.9"/><path d="M9 11.5l2 2 4-4.5"/></svg>
            <span class="sb-label">待决策</span>
            <span class="sb-badge tnum" id="sb-decisions-badge">0</span>
          </button>
        </li>
        <li>
          <button type="button" class="sb-item" data-action="switch-view" data-view="tree" aria-label="任务树">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 4v10a2 2 0 0 0 2 2h10"/><path d="M6 9h6"/><rect x="3" y="2.5" width="5" height="4" rx="1"/><rect x="3" y="13" width="5" height="4" rx="1"/><rect x="16" y="14" width="5" height="4" rx="1"/></svg>
            <span class="sb-label">任务树</span>
          </button>
        </li>
        <li>
          <button type="button" class="sb-item" data-action="switch-view" data-view="knowledge" aria-label="知识库">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 5.5A2.5 2.5 0 0 1 6.5 3H20v15.5H6.5A2.5 2.5 0 0 0 4 21z"/><path d="M4 18.5V5.5"/><path d="M8 7h8"/></svg>
            <span class="sb-label">知识库</span>
          </button>
        </li>
        <li>
          <button type="button" class="sb-item" data-action="switch-view" data-view="log" aria-label="日志">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 6h16M4 12h16M4 18h10"/></svg>
            <span class="sb-label">日志</span>
          </button>
        </li>
        <li>
          <button type="button" class="sb-item" data-action="switch-view" data-view="chat" aria-label="聊天">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21 11.5a8.5 8.5 0 0 1-12.3 7.6L4 21l1.9-4.7A8.5 8.5 0 1 1 21 11.5z"/></svg>
            <span class="sb-label">聊天</span>
          </button>
        </li>
      </ul>
      <div class="sb-foot">
        <div class="sb-status"><span class="dot" aria-hidden="true"></span><span>服务已连接</span></div>
        <div class="sb-row">
          <span>主题</span>
          <button type="button" class="sb-theme" data-action="theme">切换</button>
        </div>
      </div>
    </nav>

    <div class="main">
      <div class="view" id="view-root"></div>
      <div class="panel-backdrop" id="panel-backdrop" data-action="close-panel" hidden></div>
      <aside class="panel" id="panel" aria-label="任务详情" aria-hidden="true"></aside>
      <div class="toast-wrap" id="toast-wrap" aria-live="polite" aria-atomic="false"></div>
    </div>

  </div>
</div>

<script src="app.js"></script>
</body>
</html>
